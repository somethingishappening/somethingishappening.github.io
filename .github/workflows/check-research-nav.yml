name: Check Research navigation labels

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS action payload
        required: false
        type: string
  push:
    paths:
      - '_research/**'
      - '_layouts/research.html'
      - '_includes/upper-resolution-layer.html'
      - '.pages.yml'
      - 'scripts/check_research_nav.mjs'
      - '.github/workflows/check-research-nav.yml'

permissions:
  contents: read

jobs:
  check-navigation-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current site
        uses: actions/checkout@v6

      - name: Resolve Pages CMS Research entry
        id: entry
        shell: bash
        env:
          PAGES_CMS_PAYLOAD: ${{ inputs.payload }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const payloadText = process.env.PAGES_CMS_PAYLOAD || '';
          let entryPath = '';
          if (payloadText.trim()) {
            try {
              const payload = JSON.parse(payloadText);
              entryPath = payload?.context?.path || payload?.entry?.path || payload?.path || '';
            } catch (error) {
              console.log('::warning title=Pages CMS payload could not be parsed::The checker will test all Research projects instead. ' + String(error.message || error));
            }
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `path=${String(entryPath).replace(/\r?\n/g, '')}\n`);
          console.log(entryPath ? `Checking CMS entry: ${entryPath}` : 'No usable entry payload: checking all Research projects.');
          NODE

      - name: Build site with the GitHub Pages Jekyll environment
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Install browser checker
        shell: bash
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start local site
        shell: bash
        run: |
          python3 -m http.server 4173 --directory _site > /tmp/harri-nav-check-server.log 2>&1 &
          echo $! > /tmp/harri-nav-check-server.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/about/ >/dev/null; then
              echo "Local Jekyll site is ready."
              exit 0
            fi
            sleep 1
          done
          echo "Local site did not become ready."
          cat /tmp/harri-nav-check-server.log || true
          exit 1

      - name: Check rendered Research navigation labels
        env:
          BASE_URL: http://127.0.0.1:4173
          ENTRY_PATH: ${{ steps.entry.outputs.path }}
        run: node scripts/check_research_nav.mjs
