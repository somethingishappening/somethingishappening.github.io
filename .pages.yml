media:
- name: images
  label: Project images
  input: assets/uploads
  output: /assets/uploads
  rename: safe
  extensions:
  - jpg
  - jpeg
  - png
  - webp
  - gif
- name: videos
  label: Project videos
  input: assets/uploads/videos
  output: /assets/uploads/videos
  rename: safe
  extensions:
  - mp4
  - webm
  - mov
  - m4v
content:
- name: research_group
  label: Design Research
  type: group
  items:
  - name: research
    label: Research projects
    type: collection
    path: _research
    format: yaml-frontmatter
    filename:
      template: '{primary}.md'
      field: create
    view:
      primary: title
      sort: nav_order
      order: asc
    fields:
    - name: title
      label: Navigation title
      type: string
      required: true
      description: Shown in the main site navigation. It is also the default name used in the mobile Research bar unless you set the optional mobile name below.
    - name: mobile_research_title
      label: Mobile Research navigation name (optional)
      type: string
      description: Optional custom name shown only in the mobile Research project navigation bar. Leave blank to use the Navigation title above.
    - name: nav_order
      label: Navigation order
      type: number
      required: true
    - name: layout
      label: Project template
      type: select
      required: true
      default: research
      options:
        values:
        - name: research
          label: Research template
        - name: work
          label: Work template
      description: Choose Research template for the long article + Project Overview + figures layout, or Work template for the short description + image/video gallery layout. The project still stays under Design Research in the navigation.
    - name: research_type
      label: Research project type / descriptor
      type: string
      description: Small text shown above the large Research project title, like the project type in the Work template. Examples: Typographic Research, Visual Research, Publication, Research Project.
    - name: headline_line_1
      label: Article title — line 1
      type: string
      description: First line of the large title inside the Research article. It is independent from the Navigation title above.
    - name: headline_line_2
      label: Article title — line 2
      type: string
      description: Optional second line of the large title inside the Research article. It is independent from the Navigation title above.
    - name: abstract
      label: Abstract / project summary
      type: rich-text
      options:
        format: markdown
        switcher: false
        media: false
      description: This is the text shown in the first Research screen. On desktop its final line aligns with the footer email baseline. It is automatically linked as “Abstract” in the Research navigation.
    - name: sections
      label: Research article
      type: object
      list:
        min: 1
        collapsible:
          collapsed: true
          summary: '{heading}'
      description: Add the article sections that come after the Abstract. Each section can also be placed directly into the two-column Project Overview navigation; no manual Section IDs or separate navigation structure are needed.
      fields:
      - name: heading
        label: Section title
        type: string
        description: The heading shown in the article. For the opening section, you can leave this blank if the large Article title above should act as the heading.
      - name: heading_level
        label: Heading level
        type: select
        default: h2
        options:
          values:
          - name: h1
            label: Header 1 — chapter title
          - name: h2
            label: Header 2 — body-size bold
          - name: h3
            label: Header 3 — body-size regular, underlined
        description: Header 1 is the chapter-title level. Header 2 is body-size bold. Header 3 is body-size regular and underlined, matching the article hierarchy.
      - name: body
        label: Section text
        type: rich-text
        options:
          format: markdown
          switcher: false
          media: false
        description: Write normally. Header 1 is the chapter-title level. Header 2 is body-size bold. Header 3 is body-size regular and underlined. To cite an image, simply type (Fig. 1), (Fig. 2), etc. The website detects these references automatically.
      - name: nav_column
        label: Show in navigation
        type: select
        default: none
        options:
          values:
          - name: none
            label: Do not show
          - name: left
            label: Left column
          - name: right
            label: Right column
        description: The navigation style comes automatically from the Heading level. For Header 3, choose Right column if you want it shown in the right-side navigation, or Do not show if you want it hidden.
      - name: navigation
        label: Legacy navigation placement
        type: string
        hidden: true
        description: Preserved invisibly so older Research projects continue to work.
      - name: nav_label
        label: Navigation label (optional)
        type: string
        description: Leave blank to use the Section title. Fill this only if you want a shorter/different label in the Project Overview.
      - name: id
        label: Legacy Section ID
        type: string
        hidden: true
        description: Kept invisibly so older Research projects remain compatible.
    - name: figures
      label: Research figures
      type: object
      list:
        collapsible:
          collapsed: true
          summary: 'Fig. {number}'
      description: Add the image that corresponds to each (Fig. X) written in your article. Figure references in the text are detected automatically.
      fields:
      - name: number
        label: Figure number
        type: number
        description: 'Enter the number used in your text. Example: enter 3 for (Fig. 3). Older figures without a number continue to use their list order.'
      - name: image
        label: Image
        type: image
        options:
          media: images
          rename: safe
      - name: caption
        label: Caption
        type: text
      - name: alt
        label: Alt text
        type: text
        description: Briefly describe the image for accessibility.
    - name: toc_columns
      label: Legacy Project Overview data
      type: object
      hidden: true
      description: Preserved invisibly for backwards compatibility with older Research projects.
      list:
        min: 1
        max: 2
      fields:
      - name: groups
        label: Legacy groups
        type: object
        list: true
        fields:
        - name: title
          label: Legacy title
          type: object
          fields:
          - name: label
            label: Label
            type: string
          - name: section_id
            label: Section ID
            type: string
        - name: links
          label: Legacy links
          type: object
          list: true
          fields:
          - name: label
            label: Label
            type: string
          - name: section_id
            label: Section ID
            type: string
    - name: project_type
      label: Work template — project description / type
      type: string
      description: Used only when Project template is Work template.
    - name: title_line_1
      label: Work template — large title line 1
      type: string
      description: Used only when Project template is Work template.
    - name: title_line_2
      label: Work template — large title line 2
      type: string
      description: Used only when Project template is Work template.
    - name: description
      label: Work template — project description
      type: rich-text
      options:
        format: markdown
        switcher: false
        media: false
      description: Used only when Project template is Work template.
    - name: gallery
      label: Work template — gallery
      type: block
      list:
        collapsible:
          collapsed: true
          summary: '{type} {index}'
      blockKey: type
      blocks:
      - name: image
        label: Image
        fields:
        - name: image
          label: Image
          type: image
          required: true
          options:
            media: images
            rename: safe
        - name: alt
          label: Alt text
          type: text
          description: Briefly describe the image for accessibility.
      - name: video
        label: Video
        fields:
        - name: video
          label: Video file
          type: file
          required: true
          options:
            media: videos
            categories:
            - video
            extensions:
            - mp4
            - webm
            - mov
            - m4v
            rename: safe
        - name: poster
          label: Poster image
          type: image
          options:
            media: images
            rename: safe
          description: Shown in the project column before the video is opened.
        - name: alt
          label: Accessibility label
          type: text
