media:
- name: images
  label: Project images
  input: assets/uploads
  output: /assets/uploads
  rename: safe
  extensions:
  - jpg
  - jpeg
  - png
  - webp
  - gif
- name: videos
  label: Project videos
  input: assets/uploads/videos
  output: /assets/uploads/videos
  rename: safe
  extensions:
  - mp4
  - webm
  - mov
  - m4v
content:
- name: research_group
  label: Design Research
  type: group
  items:
  - name: research
    label: Research projects
    type: collection
    path: _research
    format: yaml-frontmatter
    filename:
      template: '{primary}.md'
      field: create
    view:
      primary: title
      sort: nav_order
      order: asc
    fields:
    - name: title
      label: Navigation title
      type: string
      required: true
      description: Shown in the main site navigation and in the mobile Research project-name bar. This can be different from the Article title below.
    - name: nav_order
      label: Navigation order
      type: number
      required: true
    - name: layout
      label: Project template
      type: select
      required: true
      default: research
      options:
        values:
        - name: research
          label: Research template
        - name: work
          label: Work template
      description: Choose Research template for the long article + Project Overview + figures layout, or Work template for the short description + image/video gallery layout. The project still stays under Design Research in the navigation.
    - name: headline_line_1
      label: Article title — line 1
      type: string
      description: First line of the large title inside the Research article. It is independent from the Navigation title above.
    - name: headline_line_2
      label: Article title — line 2
      type: string
      description: Optional second line of the large title inside the Research article. It is independent from the Navigation title above.
    - name: toc_columns
      label: Research template — Project Overview titles & subtitles
      type: object
      list:
        min: 1
        max: 2
        collapsible:
          collapsed: true
          summary: Column {index}
      description: Two desktop columns, like the reference layout. Inside each column you can add as many bold titles and subtitle links as you need.
      fields:
      - name: groups
        label: Titles
        type: object
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: '{title}'
        fields:
        - name: title
          label: Chapter title
          type: object
          required: true
          description: A normal navigation link like Header 2, but displayed in bold. Its linked Article Section is automatically displayed as a large Header 1 in the text.
          fields:
          - name: label
            label: Title
            type: string
            required: true
            description: 'For example: Header 1.'
          - name: section_id
            label: Linked Article Section ID
            type: string
            required: true
            pattern: ^[a-z0-9-]+$
            description: Same field used by Header 2 links. It must match the ID of the Article Section this title should scroll to.
        - name: links
          label: Subtitles
          type: object
          list:
            collapsible:
              collapsed: true
              summary: '{label}'
          fields:
          - name: label
            label: Subtitle
            type: string
            required: true
            description: 'For example: Header 2.'
          - name: section_id
            label: Linked Article Section ID
            type: string
            required: true
            description: This must match the ID of the Article Section that this subtitle should scroll to.
    - name: sections
      label: Research template — article sections
      type: object
      list:
        min: 1
        collapsible:
          collapsed: true
          summary: '{nav_label} ({index})'
      fields:
      - name: id
        label: Section ID
        type: string
        description: Short lowercase ID such as overview, process, typography.
        pattern: ^[a-z0-9-]+$
        required: true
      - name: nav_label
        label: Navigation label
        type: string
        required: true
      - name: heading
        label: Section heading
        type: string
        description: Text heading for this section. Sections linked by a bold chapter title are automatically shown as large Header 1 headings; sections linked as subtitles are shown as Header 2. The first section uses the large project title above, so this can be blank there.
      - name: body
        label: Section text
        type: rich-text
        options:
          format: markdown
          switcher: false
          media: false
        description: Type [fig:1], [fig:2], etc. anywhere in the text. It is published as (Fig. 1), (Fig. 2), etc.
    - name: figures
      label: Research template — figures
      type: object
      list:
        collapsible:
          collapsed: true
          summary: Figure {index}
      fields:
      - name: image
        label: Image
        type: image
        options:
          media: images
          rename: safe
      - name: caption
        label: Caption
        type: text
      - name: alt
        label: Alt text
        type: text
        description: Briefly describe the image for accessibility.
    - name: project_type
      label: Work template — project description / type
      type: string
      description: Used only when Project template is Work template.
    - name: title_line_1
      label: Work template — large title line 1
      type: string
      description: Used only when Project template is Work template.
    - name: title_line_2
      label: Work template — large title line 2
      type: string
      description: Used only when Project template is Work template.
    - name: description
      label: Work template — project description
      type: rich-text
      options:
        format: markdown
        switcher: false
        media: false
      description: Used only when Project template is Work template.
    - name: gallery
      label: Work template — gallery
      type: block
      list:
        collapsible:
          collapsed: true
          summary: '{type} {index}'
      blockKey: type
      blocks:
      - name: image
        label: Image
        fields:
        - name: image
          label: Image
          type: image
          required: true
          options:
            media: images
            rename: safe
        - name: alt
          label: Alt text
          type: text
          description: Briefly describe the image for accessibility.
      - name: video
        label: Video
        fields:
        - name: video
          label: Video file
          type: file
          required: true
          options:
            media: videos
            categories:
            - video
            extensions:
            - mp4
            - webm
            - mov
            - m4v
            rename: safe
        - name: poster
          label: Poster image
          type: image
          options:
            media: images
            rename: safe
          description: Shown in the project column before the video is opened.
        - name: alt
          label: Accessibility label
          type: text
