- name: harrilanpuisto
  label: Harrilanpuisto
  type: file
  path: _data/harrilanpuisto.yml
  format: yaml
  fields:
  - name: enabled
    label: Show in website
    type: boolean
    default: false
    description: Harrilanpuisto appears in the main navigation only when this is ON and at least one image or video has been added.
  - name: media
    label: Images and videos
    type: block
    list:
      collapsible:
        collapsed: true
        summary: '{type} {index}'
    blockKey: type
    description: Add new media at the end of this list. The public Harrilanpuisto page automatically displays the newest item first.
    blocks:
    - name: image
      label: Image
      fields:
      - name: image
        label: Image
        type: image
        required: true
        options:
          media: images
          rename: safe
      - name: alt
        label: Alt text
        type: text
      - name: caption
        label: Lightbox caption
        type: text
        description: Shown only when this item is opened in the lightbox.
    - name: video
      label: Video
      fields:
      - name: video
        label: Video file
        type: file
        required: true
        options:
          media: videos
          categories:
          - video
          extensions:
          - mp4
          - webm
          - mov
          - m4v
          rename: safe
      - name: poster
        label: Poster image
        type: image
        options:
          media: images
          rename: safe
      - name: alt
        label: Accessibility label
        type: text
      - name: caption
        label: Lightbox caption
        type: text
        description: Shown only when this item is opened in the lightbox.
- name: general
  label: General
  type: group
  items:
  - name: site_settings
    label: Site settings
    type: file
    path: _data/site.yml
    format: yaml
    fields:
    - name: brand
      label: Top-left site name
      type: string
      required: true
      description: Controls the Harri.la name shown at the top-left of every page. It is also used in browser/page titles.
    - name: footer_slot_1_visible
      label: Show footer item 1
      type: boolean
      default: true
      description: This is the slot currently used for Instagram. Turn it off to remove the item.
    - name: footer_slot_1_text
      label: Footer item 1 display text
      type: string
      required: true
      description: Rename this item freely, for example Instagram, Behance, CV, Contact, or anything else.
    - name: footer_slot_1_link_type
      label: Footer item 1 link type
      type: select
      default: external
      options:
        values:
        - name: email
          label: Email
        - name: external
          label: External URL
        - name: internal
          label: Internal website path
        - name: none
          label: No link
    - name: footer_slot_1_link
      label: Footer item 1 link
      type: string
      description: Enter an email address, full https:// URL, or internal path according to the selected link type.
    - name: footer_slot_2_visible
      label: Show footer item 2
      type: boolean
      default: true
      description: This is the slot currently used for the email address. Turn it off to remove the item.
    - name: footer_slot_2_text
      label: Footer item 2 display text
      type: string
      required: true
      description: Rename this item freely, for example Email, Contact, LinkedIn, CV, or anything else.
    - name: footer_slot_2_link_type
      label: Footer item 2 link type
      type: select
      default: email
      options:
        values:
        - name: email
          label: Email
        - name: external
          label: External URL
        - name: internal
          label: Internal website path
        - name: none
          label: No link
    - name: footer_slot_2_link
      label: Footer item 2 link
      type: string
      description: Enter an email address, full https:// URL, or internal path according to the selected link type.
    - name: design_research_label
      label: Design Research section name
      type: string
      required: true
      description: Changes this section name everywhere in the website navigation.
    - name: design_work_label
      label: Design Work section name
      type: string
      required: true
      description: Changes this section name everywhere in the website navigation.
    - name: artistic_work_label
      label: Artistic Work section name
      type: string
      required: true
      description: Changes this section name everywhere in the website navigation.
    - name: harrilanpuisto_label
      label: Harrilanpuisto section name
      type: string
      required: true
      description: Changes the Harrilanpuisto name in the website navigation and page title.
    - name: welcome_messages
      label: Welcome messages
      type: string
      list: true
  - name: about
    label: About page
    type: file
    path: about.md
    format: yaml-frontmatter
    fields:
    - name: layout
      type: string
      hidden: true
      readonly: true
    - name: title
      label: Page title
      type: string
    - name: permalink
      type: string
      hidden: true
      readonly: true
    - name: about_nav_open_research
      label: Open Design Research by default
      type: boolean
      default: true
      description: On a fresh visit to the About / landing page, start with Design Research expanded.
    - name: about_nav_open_design
      label: Open Design Work by default
      type: boolean
      default: false
      description: On a fresh visit to the About / landing page, start with Design Work expanded.
    - name: about_nav_open_artistic
      label: Open Artistic Work by default
      type: boolean
      default: false
      description: On a fresh visit to the About / landing page, start with Artistic Work expanded.
    - name: greeting_messages
      label: Greeting phrases
      type: string
      list: true
      description: The About greeting randomly uses these phrases and changes every 30 seconds.
    - name: morning_greeting_messages
      label: Morning-only greeting phrases
      type: string
      list: true
      description: These phrases are added to the About greeting rotation only from 12:00 AM (midnight) until 11:59 AM, using the visitor's local device time.
    - name: ascii_messages
      label: Fullscreen ASCII faces
      type: object
      list:
        min: 1
        collapsible:
          collapsed: true
          summary: '{text}'
      description: Add, remove, reorder, or recolor the ASCII faces used by the 10th-click fullscreen easter egg. Their display order is randomized automatically.
      fields:
      - name: text
        label: ASCII
        type: string
        required: true
        description: Type the ASCII face exactly as you want it to appear.
      - name: color
        label: Color (hex)
        type: string
        required: true
        default: '#FF0000'
        pattern:
          regex: ^#[0-9A-Fa-f]{6}$
          message: 'Use a 6-digit hex color such as #FF0000.'
        description: Hex color for this ASCII face, for example
    - name: bio
      label: Biography
      type: text
      required: true
      description: Edit the About biography here. Text wraps automatically to the column width. Press Enter only when you intentionally want a hard line break.
    - name: mini_cv_sections
      label: Mini-CV sections
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{title}'
      fields:
      - name: title
        label: Section title
        type: string
        required: true
      - name: entries
        label: Entries
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{text}'
        fields:
        - name: text
          label: Entry
          type: rich-text
          required: true
          options:
            format: markdown
            switcher: false
            media: false
          description: You can add inline links to any word or phrase. Text wraps automatically to the Mini-CV column.
    - name: surprise_images
      label: Surprise images
      type: object
      list:
        min: 1
        collapsible:
          collapsed: true
          summary: '{alt}'
      description: Images revealed at the bottom of the Mini-CV. If there is one image, it always appears. If there are two or more, one is chosen randomly each time the page loads.
      fields:
      - name: image
        label: Image
        type: image
        required: true
        options:
          media: images
          rename: safe
      - name: alt
        label: Alt text
        type: text
        description: Briefly describe the image for accessibility.
