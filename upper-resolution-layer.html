<style id="harri-upper-resolution-layer-v5">
/*
  HARRI.LA — UPPER-RESOLUTION LAYER v6.4 (Research column proportion + baseline recovery)
  ------------------------------------
  This file is deliberately additive. The existing site remains the source of
  truth through 1680px wide and on every mobile/tablet breakpoint.

  Reference desktop: 1680 × 900 CSS px.

  Above 1680px:
  - horizontal grid measurements follow viewport width, so the existing
    desktop column proportions do not collapse on ultrawide / 4K canvases;
  - vertical spacing and typography grow from the smaller of width-growth and
    height-growth, so ultrawide screens do not become vertically oversized;
  - type/vertical growth is bounded at 2× for extreme future viewports.

  Explicitly untouched:
  - all <= 1680px behaviour, including 1680 × 1050;
  - all <= 900px mobile behaviour;
  - Work media/gallery 18px spacing;
  - Research 43.5vh hanging line;
  - Research figure width/fit variables and CMS figure controls;
  - Research scrolling/navigation logic;
  - About/Work/Research/Harrilanpuisto content and CMS data.
*/

@media (min-width:1681px){
  :root{
    /*
      HORIZONTAL SHELL
      These values are the original 1680px desktop measurements expressed as
      vw. Therefore 220 / centre / 300 on About, and the 745:660 Work/Research
      tracks, retain the same horizontal composition as the viewport widens.
    */
    --harri-hi-left:13.0952380952vw;      /* 220 / 1680 */
    --harri-hi-gap:1.6666666667vw;        /* 28 / 1680 */
    --harri-hi-pad-x:1.0714285714vw;      /* 18 / 1680 */
    --harri-hi-about-right:17.8571428571vw;/* 300 / 1680 */

    /*
      VERTICAL + TYPE SCALE
      Each preferred value is tied to both the 1680px reference width and the
      900px reference height. min() chooses the limiting dimension. The 2× cap
      prevents runaway enlargement beyond the requested high-resolution range.
    */
    --harri-hi-pad-top-32:clamp(32px,min(1.904762vw,3.555556vh),64px);
    --harri-hi-pad-bottom-26:clamp(26px,min(1.547619vw,2.888889vh),52px);

    --harri-hi-brand:clamp(27px,min(1.607143vw,3vh),54px);
    --harri-hi-welcome-height:clamp(148px,min(8.809524vw,16.444444vh),296px);
    --harri-hi-welcome-type:clamp(28px,min(1.666667vw,3.111111vh),56px);
    /* The final shared desktop navigation deliberately uses one type size
       for category labels, project links and Harrilanpuisto: 17px / 18.7px. */
    --harri-hi-nav-type:clamp(17px,min(1.011905vw,1.888889vh),34px);
    --harri-hi-nav-line:clamp(18.7px,min(1.113095vw,2.077778vh),37.4px);
    --harri-hi-link-type:var(--harri-hi-nav-type);
    --harri-hi-link-line:var(--harri-hi-nav-line);
    --harri-hi-footer-type:clamp(13px,min(0.77381vw,1.444444vh),26px);

    --harri-hi-project-type:clamp(27px,min(1.607143vw,3vh),54px);
    --harri-hi-h1:clamp(54px,min(3.214286vw,6vh),108px);
    --harri-hi-body:clamp(18px,min(1.071429vw,2vh),36px);
    --harri-hi-toc:clamp(13px,min(0.77381vw,1.444444vh),26px);
  }

  /* =========================================================
     SHARED DESKTOP NAVIGATION
     ========================================================= */

  }

  body.page-work .project-info h1,
  body.page-harrilanpuisto .project-info h1{

  }

  body.page-work .project-description,
  body.page-harrilanpuisto .project-description{

  }

  /* Work and Harrilanpuisto gallery items both keep their baseline
     natural-aspect-ratio sizing. Do not impose viewport-height minimums:
     they create large blank gaps between differently proportioned images. */

  /* Deliberately no Work .media-stack gap / media-item margin overrides.
     The Work template remains on its baseline 18px image spacing. */

  /* =========================================================
     RESEARCH
     Keep the existing 745:660 grid and exact 43.5vh hanging line.
     IMPORTANT: no figure-stage width/max-width/caption-width override here;
     the baseline fit script and CMS --research-figure-fit-width stay in charge.
     ========================================================= */
  body.page-research .layout{
    grid-template-columns:
      var(--harri-hi-left)
      minmax(0,745fr)
      minmax(0,660fr) !important;
    gap:var(--harri-hi-gap) !important;

      var(--harri-hi-pad-top-32)

  /* The Abstract wrapper used to remain capped at the baseline 700px even

<style id="harri-research-column-proportion-v6-4">
/*
  RESEARCH TEXT COLUMN — preserve the original column relationship
  ---------------------------------------------------------------
  At the 1680px reference, the 700px Research measure occupies about 96.5%
  of the middle paper column. The previous high-resolution rules preserved a
  constant em measure instead, which made the text progressively too narrow
  relative to the actual middle column on ultrawide / 4K / 5K screens.

  Keep the entire Research copy wrapper at the original 96.5% paper-column
  proportion. Child paragraphs/lists then use the wrapper's full width.
  This reduces the accidental extra wrapping that made the Abstract too tall
  and lets the existing exact footer-baseline script align its last line again.

  <=1680px and mobile are intentionally untouched.
*/

  body.page-research .research-copy{
    width:96.5% !important;
    max-width:96.5% !important;
  }

  body.page-research .research-copy > p,
  body.page-research .research-copy > ul,
  body.page-research .research-copy ul,
  body.page-research .research-copy ul > li{
    max-width:100% !important;
  }
}
</style>

<style id="harri-research-desktop-hierarchy-lock-v6-14">
/*
  RESEARCH DESKTOP TYPOGRAPHIC HIERARCHY LOCK
  -------------------------------------------
  Keep the hierarchy identical at every desktop resolution:

  running text = reference size
  H2           = same size, bold
  H3           = same size, regular + underline

  The previous fixed 26px / 12px heading margins became proportionally
  smaller as the high-resolution layer enlarged the type. Express those
  distances in em so the visual hierarchy stays identical while scaling.

  Baseline reference:
    26 / 18 = 1.444444em top
    12 / 18 = 0.666667em bottom

  Mobile remains untouched.
*/
@media (min-width:901px){
  body.page-research .paper section:not(#abstract) > h2,

<script id="harri-unified-desktop-scale-script-v7">
(function(){
  "use strict";

  const BASE_W = 1680;
  const BASE_H = 900;
  const FOUR_K_W = 4096;
  const FOUR_K_H = 2304;

  const base = {
    "pad-x":18,
    "pad-top":32,
    "pad-bottom":26,
    "about-pad-bottom":25,
    "left":220,
    "about-right":300,
    "gap":28,

    "brand":27,
    "welcome-height":148,
    "welcome-type":28,
    "nav":17,
    "nav-line":18.7,
    "toggle":20,
    "toggle-width":22,
    "footer":13,

    "project-type":27,
    "h1":54,
    "chapter":24,
    "body":18,
    "toc":13,
    "caption":12,

    "about-greeting":54,
    "about-bio":40,
    "about-nav-top":148,
    "about-greeting-top":145,
    "about-greeting-height":275,

    "space-3":3,
    "space-5":5,
    "space-8":8,
    "space-10":10,
    "space-12":12,
    "space-13":13,
    "space-14":14,
    "space-18":18,
    "space-24":24,
    "space-26":26,
    "space-34":34,

    "work-title-max":610,
    "research-title-max":680,
    "copy-max":700,
    "work-copy-max":660
  };

  let raf = 0;

  function desktopScale(){
    const w = window.innerWidth;
    const h = window.innerHeight;

    if(w <= 900) return 1;

    /*
      The reference shrinks uniformly below 1680×900.
      Growth is capped at the established 2× 4K checkpoint.
      Beyond the checkpoint the old 4096 -> 5120 continuation is preserved.
    */
    if(w > FOUR_K_W && h > FOUR_K_H){
      return 2 * Math.min(w / FOUR_K_W, h / FOUR_K_H);
    }

    return Math.min(2, Math.min(w / BASE_W, h / BASE_H));
  }

  function viewportFitKey(){
    return [
      "harri-cv-research-fit",
      Math.round(window.innerWidth),
      Math.round(window.innerHeight)
    ].join(":");
  }

  function fallbackCvResearchFit(){
    /*
      Keep the established 1× fallback while a direct Research entry obtains
      the exact About Mini-CV fit for this viewport. The site's responsive
      scale itself is never changed by this fallback.
    */
    return 1;
  }

  function isResearchPage(){
    return !!(
      document.body &&
      document.body.classList.contains("page-research")
    );
  }


  function revealResearchAfterExactFit(){
    document.documentElement.classList.remove(
      "harri-research-fit-pending"
    );
  }

  let researchFitProbe = null;
  let researchFitProbeKey = "";
  let researchFitProbeToken = 0;

  function removeResearchFitProbe(){
    if(researchFitProbe){
      researchFitProbe.remove();
      researchFitProbe = null;
    }
    researchFitProbeKey = "";
  }

  function requestExactResearchFitFromAbout(){
    if(
      window.innerWidth <= 900 ||
      !document.body ||
      !isResearchPage() ||
      readStoredCvResearchFit() !== null
    ){
      return;
    }

    const key = viewportFitKey();

    if(
      researchFitProbe &&
      researchFitProbeKey === key
    ){
      return;
    }

    removeResearchFitProbe();

    const token = ++researchFitProbeToken;
    const frame = document.createElement("iframe");

    researchFitProbe = frame;
    researchFitProbeKey = key;

    frame.setAttribute("aria-hidden", "true");
    frame.setAttribute("tabindex", "-1");
    frame.setAttribute("title", "");
    frame.style.cssText = [
      "position:fixed",
      "left:-200vw",
      "top:0",
      "width:100vw",
      "height:100vh",
      "border:0",
      "margin:0",
      "padding:0",
      "opacity:0",
      "visibility:hidden",
      "pointer-events:none",
      "z-index:-1"
    ].join(";");

    frame.addEventListener("load", async ()=>{
      try{
        const childWindow = frame.contentWindow;
        const childDocument = frame.contentDocument;

        if(!childWindow || !childDocument) return;

        if(childDocument.fonts && childDocument.fonts.ready){
          try{
            await childDocument.fonts.ready;
          }catch(e){}
        }

        /*
          About schedules its exact Mini-CV measurement on animation frames
          and again after fonts/load. Give those existing callbacks time to
          settle, then read the value they already computed.
        */
        await new Promise((resolve)=>{
          childWindow.requestAnimationFrame(()=>{
            childWindow.requestAnimationFrame(resolve);
          });
        });

        await new Promise((resolve)=>setTimeout(resolve, 40));

        if(
          token !== researchFitProbeToken ||
          viewportFitKey() !== key
        ){
          return;
        }

        let fit = null;

        try{
          const stored = parseFloat(
            childWindow.sessionStorage.getItem(key) || ""
          );

          if(Number.isFinite(stored) && stored >= 1){
            fit = stored;
          }
        }catch(e){}

        if(fit === null){
          const cssFit = parseFloat(
            childDocument.documentElement.style.getPropertyValue(
              "--harri-cv-research-fit"
            ) || ""
          );

          if(Number.isFinite(cssFit) && cssFit >= 1){
            fit = cssFit;
          }
        }

        if(fit !== null){
          writeCvResearchFit(fit);
          revealResearchAfterExactFit();
        }
      }catch(e){
        /* Same-origin About should be readable; keep the existing 1× fallback
           if a browser/privacy setting prevents the probe. */
        revealResearchAfterExactFit();
      }finally{
        if(token === researchFitProbeToken){
          removeResearchFitProbe();
        }
      }
    }, {once:true});

    frame.addEventListener("error", ()=>{
      if(token !== researchFitProbeToken) return;
      revealResearchAfterExactFit();
      removeResearchFitProbe();
    }, {once:true});

    /* Fail-safe only: never leave Research hidden if the probe is blocked. */
    window.setTimeout(()=>{
      if(
        token === researchFitProbeToken &&
        document.documentElement.classList.contains(
          "harri-research-fit-pending"
        )
      ){
        revealResearchAfterExactFit();
        removeResearchFitProbe();
      }
    }, 1500);

    frame.src = "/about/?harri-fit-probe=1";
    document.body.appendChild(frame);
  }

  function readStoredCvResearchFit(){
    try{
      const value = parseFloat(
        sessionStorage.getItem(viewportFitKey()) || ""
      );

      if(Number.isFinite(value) && value >= 1){
        return value;
      }
    }catch(e){}

    return null;
  }

  const cvResearchFitKeys = [
    "project-type",
    "h1",
    "chapter",
    "body",
    "toc",
    "caption",
    "space-12",
    "space-14",
    "space-18",
    "space-24",
    "space-26"
  ];

  function applyCvResearchFitVars(value){
    const fit = Math.max(1, Number(value) || 1);
    const root = document.documentElement;
    const siteScale =
      parseFloat(root.style.getPropertyValue("--harri-site-scale")) ||
      desktopScale();

    root.style.setProperty(
      "--harri-cv-research-fit",
      fit.toFixed(5)
    );

    cvResearchFitKeys.forEach((key)=>{
      const value = base[key];
      if(typeof value !== "number") return;

      root.style.setProperty(
        "--harri-fit-" + key,
        (value * siteScale * fit).toFixed(4) + "px"
      );
    });

    return fit;
  }

  function clearCvResearchFitVars(){
    const root = document.documentElement;
    root.style.removeProperty("--harri-cv-research-fit");

    cvResearchFitKeys.forEach((key)=>{
      root.style.removeProperty("--harri-fit-" + key);
    });
  }

  function writeCvResearchFit(value, isExact = true){
    const fit = applyCvResearchFitVars(value);

    try{
      sessionStorage.setItem(
        viewportFitKey(),
        fit.toFixed(5)
      );
    }catch(e){}

    window.dispatchEvent(
      new CustomEvent(
        "harri:cv-research-fit",
        {detail:{fit, exact:isExact}}
      )
    );

    return fit;
  }

  function visibleCvSections(){
    const cvColumn = document.querySelector(".cv-column");
    if(!cvColumn) return [];

    return Array.from(
      cvColumn.querySelectorAll(".cv-section")
    ).filter((section)=>{
      return getComputedStyle(section).display !== "none";
    });
  }

  function miniCvVisibleBottom(cvColumn, sections){
    if(!cvColumn || !sections.length) return 0;

    const columnRect = cvColumn.getBoundingClientRect();
    const lastRect =
      sections[sections.length - 1].getBoundingClientRect();

    /*
      Add scrollTop so this remains a content-space measurement even if the
      visitor has already moved the CV before a resize event.
    */
    return (
      lastRect.bottom -
      columnRect.top +
      cvColumn.scrollTop
    );
  }

  function measureAboutCvResearchFit(){
    if(
      window.innerWidth <= 900 ||
      !document.body ||
      !document.body.classList.contains("page-about")
    ){
      return null;
    }

    const cvColumn = document.querySelector(".cv-column");
    const sections = visibleCvSections();

    if(!cvColumn || !sections.length) return null;

    const originalScroll = cvColumn.scrollTop;

    /*
      Always start from the established responsive size. Only grow if the
      final visible CV section leaves real unused height below it.
    */
    applyCvResearchFitVars(1);
    void cvColumn.offsetHeight;

    const target = cvColumn.clientHeight;
    let naturalBottom = miniCvVisibleBottom(
      cvColumn,
      sections
    );

    if(naturalBottom >= target - 0.75){
      cvColumn.scrollTop = originalScroll;
      return writeCvResearchFit(1);
    }

    let low = 1;
    let high = 1.08;

    /*
      Expand the search range until the CV reaches/passes the bottom.
      4× is only a safety ceiling; normal responsive resolutions settle
      well below it.
    */
    while(high < 4){
      applyCvResearchFitVars(high);
      void cvColumn.offsetHeight;

      if(
        miniCvVisibleBottom(cvColumn, sections) >=
        target - 0.75
      ){
        break;
      }

      low = high;
      high *= 1.12;
    }

    high = Math.min(high, 4);

    for(let i=0;i<18;i+=1){
      const mid = (low + high) / 2;

      applyCvResearchFitVars(mid);
      void cvColumn.offsetHeight;

      if(
        miniCvVisibleBottom(cvColumn, sections) >=
        target - 0.75
      ){
        high = mid;
      }else{
        low = mid;
      }
    }

    /*
      Use the upper bound so the last entry reaches/slightly passes the
      bottom rather than leaving a sub-pixel white line.
    */
    const fit = Math.min(
      4,
      Math.ceil(high * 1000) / 1000
    );

    cvColumn.scrollTop = originalScroll;
    return writeCvResearchFit(fit);
  }

  let cvFitRaf = 0;

  function scheduleCvResearchFit(){
    cancelAnimationFrame(cvFitRaf);

    cvFitRaf = requestAnimationFrame(()=>{
      cvFitRaf = 0;

      const measured = measureAboutCvResearchFit();
      if(measured !== null) return;

      const stored = readStoredCvResearchFit();

      writeCvResearchFit(
        stored === null
          ? fallbackCvResearchFit()
          : stored,
        stored !== null
      );

      if(stored !== null){
        revealResearchAfterExactFit();
      }

      /*
        A direct Research deep-link has no About-derived fit yet. Measure the
        real About Mini-CV off-screen at this exact viewport and reuse its
        result. This changes only the shared fit handoff; desktopScale(), base
        values, breakpoints and every existing About measurement rule remain
        untouched.
      */
      if(stored === null){
        requestExactResearchFitFromAbout();
      }
    });
  }

  function apply(){
    raf = 0;

    if(window.innerWidth <= 900){
      revealResearchAfterExactFit();
      document.documentElement.style.removeProperty("--harri-site-scale");
      clearCvResearchFitVars();
      Object.keys(base).forEach((key)=>{
        document.documentElement.style.removeProperty("--harri-u-" + key);
      });
      return;
    }

    const scale = desktopScale();
    const root = document.documentElement;

    root.style.setProperty("--harri-site-scale", String(scale));

    Object.entries(base).forEach(([key,value])=>{
      root.style.setProperty(
        "--harri-u-" + key,
        (value * scale).toFixed(4) + "px"
      );
    });

    window.dispatchEvent(
      new CustomEvent("harri:desktop-scale", {detail:{scale}})
    );

    scheduleCvResearchFit();
  }

  function schedule(){
    if(
      researchFitProbe &&
      researchFitProbeKey !== viewportFitKey()
    ){
      researchFitProbeToken += 1;
      removeResearchFitProbe();
    }

    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(apply);
  }

  apply();

  window.addEventListener("resize",schedule,{passive:true});
  window.addEventListener("orientationchange",schedule,{passive:true});

  if(window.visualViewport){
    window.visualViewport.addEventListener("resize",schedule,{passive:true});
  }

  if(document.readyState === "loading"){
    document.addEventListener(
      "DOMContentLoaded",
      scheduleCvResearchFit,
      {once:true}
    );
  }else{
    scheduleCvResearchFit();
  }

  if(document.fonts && document.fonts.ready){
    document.fonts.ready
      .then(scheduleCvResearchFit)
      .catch(scheduleCvResearchFit);
  }

  window.addEventListener(
    "load",
    scheduleCvResearchFit,
    {once:true}
  );
})();
</script>


<style id="harri-shared-left-rail-shell-lock-v1">
/*
  SHARED DESKTOP LEFT-RAIL SHELL LOCK
  -----------------------------------
  Harri.la, the main navigation and the footer must occupy the same outer
  desktop frame on Work, Research and Harrilanpuisto at every desktop scale.

  Work/Harrilanpuisto already resolve to these values. Research historically
  kept an older 28px / 56px sticky inset-height pair, which could move its
  left rail relative to the shared 32px-top / 26px-bottom shell, especially
  after scrolling or at scaled desktop sizes.

  This rule changes only the sticky rail inset/height. It does not alter grid
  tracks, horizontal page margins, typography, content widths, media, figure
  geometry, menus, or mobile behavior.
*/
@media (min-width:901px){
  /* Work and Harrilanpuisto use sticky rails, so their sticky inset mirrors
     the layout padding. */
  body.page-work .left,
  body.page-harrilanpuisto .left{
    top:var(--harri-u-pad-top,32px) !important;
    height:calc(
      100vh - var(--harri-u-pad-top,32px) - var(--harri-u-pad-bottom,26px)
    ) !important;
  }

  /* Research is deliberately a relative rail inside a viewport-height grid.
     Its layout padding already supplies the same top/bottom shell. Adding the
     sticky inset here a second time pushed the entire Research menu downward. */
  body.page-research .left,
  body.page-research .right{
    top:auto !important;
    height:100% !important;
  }
}
</style>
