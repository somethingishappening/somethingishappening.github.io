<style id="harri-browser-consistency">
/*
  HARRI.LA BROWSER CONSISTENCY LAYER
  ----------------------------------
  Preserve the approved full-width design exactly.
  No max-width artboard, no centering, no new outer margins,
  no changed grid columns or page spacing.
*/
html{
  -webkit-text-size-adjust:100%;

  font-synthesis:none;
}

  font-optical-sizing:auto;
}

button,

}

img,

/* Prevent browser-specific intrinsic sizing from changing grid tracks. */
.about-layout > *,
.layout > *{

}

/* Keep the existing viewport-based composition, but use the modern

    .about-layout{
      height:100dvh;

    .page-research .layout,

      min-height:100dvh;

    .page-harrilanpuisto .left,

      height:calc(100dvh - 58px);
    }

    .page-research .left,
    .page-research .right{

    }

    .page-harrilanpuisto .media-item{
