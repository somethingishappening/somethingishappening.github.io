<style id="harri-desktop-top-baseline-style">
.harri-top-baseline-marker{
  display:inline-block !important;
  width:0 !important;
  height:0 !important;
  margin:0 !important;
  padding:0 !important;
  border:0 !important;
  overflow:hidden !important;
  vertical-align:baseline !important;
  line-height:0 !important;
  font-size:0 !important;
  pointer-events:none !important;
}
</style>

<script class="harri-desktop-top-baseline-script">
(function(){
  const referenceSelector = {{ include.reference | jsonify }};
  const targetSelector = {{ include.target | jsonify }};
  const desktopBreakpoint = 900;

  function start(){
    const reference = document.querySelector(referenceSelector);
    const target = document.querySelector(targetSelector);
    if(!reference || !target) return;

    let raf = 0;
    let referenceMarker = null;
    let targetMarker = null;

    function visible(el){
      if(!el) return false;
      const style = getComputedStyle(el);
      return style.display !== "none" &&
             style.visibility !== "hidden" &&
             el.getClientRects().length > 0;
    }

    function firstTextNode(container){
      const walker = document.createTreeWalker(
        container,
        NodeFilter.SHOW_TEXT,
        {
          acceptNode(node){
            if(!node.nodeValue || !node.nodeValue.trim()){
              return NodeFilter.FILTER_REJECT;
            }
            const parent = node.parentElement;
            if(!parent || !visible(parent)){
              return NodeFilter.FILTER_REJECT;
            }
            return NodeFilter.FILTER_ACCEPT;
          }
        }
      );
      return walker.nextNode() ? walker.currentNode : null;
    }

    function makeMarker(container, role){
      const old = container.querySelector(
        '.harri-top-baseline-marker[data-top-baseline-role="' + role + '"]'
      );
      if(old) old.remove();

      const textNode = firstTextNode(container);
      if(!textNode) return null;

      const marker = document.createElement("span");
      marker.className = "harri-top-baseline-marker";
      marker.dataset.topBaselineRole = role;
      marker.setAttribute("aria-hidden", "true");

      /*
        Place marker immediately after the first text node. For a single-line
        project label/title this marker sits on that line's true baseline.
      */
      textNode.parentNode.insertBefore(marker, textNode.nextSibling);
      return marker;
    }

    function ensureMarkers(){
      if(!referenceMarker || !referenceMarker.isConnected){
        referenceMarker = makeMarker(reference, "reference");
      }
      if(!targetMarker || !targetMarker.isConnected){
        targetMarker = makeMarker(target, "target");
      }
      return !!(referenceMarker && targetMarker);
    }

    function align(){
      cancelAnimationFrame(raf);

      raf = requestAnimationFrame(function(){
        if(window.innerWidth <= desktopBreakpoint){
          target.style.transform = "";
          return;
        }

        /* Always measure from the target's natural position. */
        target.style.transform = "";

        if(!ensureMarkers()) return;

        const referenceBaseline =
          referenceMarker.getBoundingClientRect().top;
        const targetBaseline =
          targetMarker.getBoundingClientRect().top;

        const delta = referenceBaseline - targetBaseline;

        target.style.transform =
          "translateY(" + delta.toFixed(2) + "px)";
      });
    }

    align();

    window.addEventListener("resize", align, {passive:true});
    window.addEventListener("orientationchange", align, {passive:true});

    if(document.fonts && document.fonts.ready){
      document.fonts.ready.then(function(){
        referenceMarker = null;
        targetMarker = null;
        align();
      });
    }

    if("ResizeObserver" in window){
      const observer = new ResizeObserver(align);
      observer.observe(reference);
      observer.observe(target);
    }
  }

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", start, {once:true});
  } else {
    start();
  }
})();
</script>
