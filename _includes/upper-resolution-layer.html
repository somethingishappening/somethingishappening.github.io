<style id="harri-upper-resolution-layer-v3">
/*
  HARRI.LA — UPPER-RESOLUTION LAYER v3
  ------------------------------------
  This file is deliberately additive. The existing site remains the source of
  truth through 1680px wide and on every mobile/tablet breakpoint.

  Reference desktop: 1680 × 900 CSS px.

  Above 1680px:
  - horizontal grid measurements follow viewport width, so the existing
    desktop column proportions do not collapse on ultrawide / 4K canvases;
  - vertical spacing and typography grow from the smaller of width-growth and
    height-growth, so ultrawide screens do not become vertically oversized;
  - type/vertical growth is bounded at 2× for extreme future viewports.

  Explicitly untouched:
  - all <= 1680px behaviour, including 1680 × 1050;
  - all <= 900px mobile behaviour;
  - Work media/gallery 18px spacing;
  - Research 43.5vh hanging line;
  - Research figure width/fit variables and CMS figure controls;
  - Research scrolling/navigation logic;
  - About/Work/Research/Harrilanpuisto content and CMS data.
*/

@media (min-width:1681px){
  :root{
    /*
      HORIZONTAL SHELL
      These values are the original 1680px desktop measurements expressed as
      vw. Therefore 220 / centre / 300 on About, and the 745:660 Work/Research
      tracks, retain the same horizontal composition as the viewport widens.
    */
    --harri-hi-left:13.0952380952vw;      /* 220 / 1680 */
    --harri-hi-gap:1.6666666667vw;        /* 28 / 1680 */
    --harri-hi-pad-x:1.0714285714vw;      /* 18 / 1680 */
    --harri-hi-about-right:17.8571428571vw;/* 300 / 1680 */

    /*
      VERTICAL + TYPE SCALE
      Each preferred value is tied to both the 1680px reference width and the
      900px reference height. min() chooses the limiting dimension. The 2× cap
      prevents runaway enlargement beyond the requested high-resolution range.
    */
    --harri-hi-pad-top-32:clamp(32px,min(1.904762vw,3.555556vh),64px);
    --harri-hi-pad-bottom-26:clamp(26px,min(1.547619vw,2.888889vh),52px);

    --harri-hi-brand:clamp(27px,min(1.607143vw,3vh),54px);
    --harri-hi-welcome-height:clamp(148px,min(8.809524vw,16.444444vh),296px);
    --harri-hi-welcome-type:clamp(28px,min(1.666667vw,3.111111vh),56px);
    --harri-hi-nav-type:clamp(20px,min(1.190476vw,2.222222vh),40px);
    --harri-hi-nav-line:clamp(21px,min(1.25vw,2.333333vh),42px);
    --harri-hi-link-type:clamp(17px,min(1.011905vw,1.888889vh),34px);
    --harri-hi-link-line:clamp(18.7px,min(1.113095vw,2.077778vh),37.4px);
    --harri-hi-footer-type:clamp(13px,min(0.77381vw,1.444444vh),26px);

    --harri-hi-project-type:clamp(27px,min(1.607143vw,3vh),54px);
    --harri-hi-h1:clamp(54px,min(3.214286vw,6vh),108px);
    --harri-hi-body:clamp(18px,min(1.071429vw,2vh),36px);
    --harri-hi-toc:clamp(13px,min(0.77381vw,1.444444vh),26px);
  }

  /* =========================================================
     SHARED DESKTOP NAVIGATION
     ========================================================= */
  body.page-about .brand,
  body.page-work .brand,
  body.page-research .brand,
  body.page-harrilanpuisto .brand{
    font-size:var(--harri-hi-brand) !important;
  }

  body.page-work .welcome-zone,
  body.page-research .welcome-zone,
  body.page-harrilanpuisto .welcome-zone{
    flex-basis:var(--harri-hi-welcome-height) !important;
    height:var(--harri-hi-welcome-height) !important;
    min-height:var(--harri-hi-welcome-height) !important;
  }

  body.page-work .welcome,
  body.page-research .welcome,
  body.page-harrilanpuisto .welcome{
    font-size:var(--harri-hi-welcome-type) !important;
  }

  body.page-about .group-head,
  body.page-work .group-head,
  body.page-research .group-head,
  body.page-harrilanpuisto .group-head{
    font-size:var(--harri-hi-nav-type) !important;
    line-height:var(--harri-hi-nav-line) !important;
  }

  body.page-about .project-links a,
  body.page-work .project-links a,
  body.page-research .project-links a,
  body.page-harrilanpuisto .project-links a{
    font-size:var(--harri-hi-link-type) !important;
    line-height:var(--harri-hi-link-line) !important;
  }

  body.page-about .harrilanpuisto-link{
    font-size:var(--harri-hi-nav-type) !important;
  }

  body.page-about .left-footer,
  body.page-work .left-footer,
  body.page-research .left-footer,
  body.page-harrilanpuisto .left-footer{
    font-size:var(--harri-hi-footer-type) !important;
  }

  /* =========================================================
     ABOUT
     Keep the original 220 / flexible / 300 relationship relative
     to viewport width rather than letting only the middle track grow.
     ========================================================= */
  body.page-about .about-layout{
    --page-pad-x:var(--harri-hi-pad-x) !important;
    --page-pad-top:var(--harri-hi-pad-top-32) !important;
    --page-pad-bottom:clamp(25px,min(1.488095vw,2.777778vh),50px) !important;
    --left-w:var(--harri-hi-left) !important;
    --right-w:var(--harri-hi-about-right) !important;
    --gap:var(--harri-hi-gap) !important;
  }

  body.page-about .left nav{
    margin-top:clamp(148px,min(8.809524vw,16.444444vh),296px) !important;
  }

  body.page-about .greeting-zone{
    top:clamp(145px,min(8.630952vw,16.111111vh),290px) !important;
    height:clamp(275px,min(16.369048vw,30.555556vh),550px) !important;
  }

  body.page-about .about-greeting{
    font-size:var(--harri-hi-h1) !important;
  }

  body.page-about .about-copy{
    font-size:clamp(40px,min(2.380952vw,4.444444vh),80px) !important;
  }

  /* Preserve the established Mini-CV top alignment. */
  body.page-about .cv-column{
    padding-top:0 !important;
  }

  /* In the chosen baseline CV H2 and running text are both 18px desktop. */
  body.page-about .cv-section h2,
  body.page-about .cv-item{
    font-size:var(--harri-hi-body) !important;
  }

  body.page-about .cv-section h2{
    margin-top:0 !important;
    margin-bottom:clamp(12px,min(0.714286vw,1.333333vh),24px) !important;
  }

  body.page-about .cv-section{
    margin-bottom:clamp(26px,min(1.547619vw,2.888889vh),52px) !important;
  }

  body.page-about .cv-item{
    margin-bottom:clamp(10px,min(0.595238vw,1.111111vh),20px) !important;
  }

  /* =========================================================
     WORK + ARTISTIC + HARRILANPUISTO
     Horizontal shell scales with viewport width. Centre/right keep
     the existing 745:660 relationship. Media-stack spacing is not touched.
     ========================================================= */
  body.page-work .layout,
  body.page-harrilanpuisto .layout{
    grid-template-columns:
      var(--harri-hi-left)
      minmax(0,745fr)
      minmax(0,660fr) !important;
    gap:var(--harri-hi-gap) !important;
    padding:
      var(--harri-hi-pad-top-32)
      var(--harri-hi-pad-x)
      var(--harri-hi-pad-bottom-26) !important;
  }

  body.page-work .left,
  body.page-harrilanpuisto .left,
  body.page-work .project-info,
  body.page-harrilanpuisto .project-info{
    top:var(--harri-hi-pad-top-32) !important;
    height:calc(100vh - clamp(58px,min(3.452381vw,6.444444vh),116px)) !important;
  }

  body.page-work .project-type,
  body.page-harrilanpuisto .project-type{
    font-size:var(--harri-hi-project-type) !important;
    margin-bottom:clamp(24px,min(1.428571vw,2.666667vh),48px) !important;
  }

  body.page-work .project-info h1,
  body.page-harrilanpuisto .project-info h1{
    font-size:var(--harri-hi-h1) !important;
    max-width:clamp(610px,min(36.309524vw,67.777778vh),1220px) !important;
  }

  body.page-work .project-description,
  body.page-harrilanpuisto .project-description{
    max-width:clamp(660px,min(39.285714vw,73.333333vh),1320px) !important;
    font-size:var(--harri-hi-body) !important;
  }

  body.page-work .media-item,
  body.page-harrilanpuisto .media-item{
    min-height:calc(100vh - clamp(58px,min(3.452381vw,6.444444vh),116px)) !important;
  }

  /* Deliberately no .media-stack gap / media-item margin overrides. */

  /* =========================================================
     RESEARCH
     Keep the existing 745:660 grid and exact 43.5vh hanging line.
     IMPORTANT: no figure-stage width/max-width/caption-width override here;
     the baseline fit script and CMS --research-figure-fit-width stay in charge.
     ========================================================= */
  body.page-research .layout{
    grid-template-columns:
      var(--harri-hi-left)
      minmax(0,745fr)
      minmax(0,660fr) !important;
    gap:var(--harri-hi-gap) !important;
    padding:
      var(--harri-hi-pad-top-32)
      var(--harri-hi-pad-x)
      var(--harri-hi-pad-bottom-26) !important;
  }

  body.page-research .project-title{
    font-size:var(--harri-hi-project-type) !important;
    margin-bottom:clamp(24px,min(1.428571vw,2.666667vh),48px) !important;
  }

  body.page-research .paper h1{
    font-size:var(--harri-hi-h1) !important;
    max-width:clamp(680px,min(40.47619vw,75.555556vh),1360px) !important;
    margin-bottom:clamp(18px,min(1.071429vw,2vh),36px) !important;
  }

  body.page-research .paper h1.chapter-heading{
    margin-top:clamp(42px,min(2.5vw,4.666667vh),84px) !important;
  }

  /*
    The actual Research section H2/H3 in the chosen baseline is 18px, not the
    older generic 24px .paper h2 rule. Scale that established style only.
  */
  body.page-research .paper section:not(#abstract) > h2,
  body.page-research .paper .research-copy h2,
  body.page-research .paper section:not(#abstract) > h3,
  body.page-research .paper .research-copy h3{
    font-size:var(--harri-hi-body) !important;
  }

  body.page-research .paper p,
  body.page-research .research-copy ul > li{
    font-size:var(--harri-hi-body) !important;
    line-height:1.2 !important;
    max-width:clamp(700px,min(41.666667vw,77.777778vh),1400px) !important;
  }

  body.page-research .toc{
    width:min(clamp(320px,min(19.047619vw,35.555556vh),640px),48%) !important;
    min-width:clamp(290px,min(17.261905vw,32.222222vh),580px) !important;
    gap:clamp(34px,min(2.02381vw,3.777778vh),68px) !important;
    font-size:var(--harri-hi-toc) !important;
  }

  /*
    Intentionally no .figure-stage positional/size rule here.
    `top:43.5vh`, the restored left/right figure rail, the CMS widthPercent,
    and --research-figure-fit-width all remain exactly baseline-controlled.
  */
}
</style>
