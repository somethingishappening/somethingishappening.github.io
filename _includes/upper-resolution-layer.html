<style id="harri-proportional-desktop-canvas-v7">
/*
  HARRI.LA — PROPORTIONAL DESKTOP CANVAS v7
  ------------------------------------------
  The approved desktop composition is treated as a 1536px-wide reference.
  On desktop/laptop (>900px), the entire composition scales uniformly with
  viewport width instead of reflowing at small desktop sizes or becoming tiny
  on 5K displays. Mobile remains completely owned by the existing <=900px CSS.

  1536px was chosen from the approved reference screenshots: at that width the
  original 220px left rail, 28px gutters and 300px About CV rail reproduce the
  same column proportions and text wrapping shown in both the desired 1024px
  and 5120px examples.
*/

html.harri-proportional-desktop{
  --harri-canvas-width:1536px;
  --harri-canvas-height:900px; /* JS replaces this with viewport-height / scale */
  --harri-canvas-scale:1;
  --harri-research-hanging-top:391.5px;
}

@media (min-width:901px){
  html.harri-proportional-desktop,
  html.harri-proportional-desktop body{
    width:100% !important;
    min-width:0 !important;
    background:#fff !important;
  }

  /* One source-width for every desktop template. JS zoom maps it to 100vw. */
  html.harri-proportional-desktop body > .about-layout,
  html.harri-proportional-desktop body > .layout{
    box-sizing:border-box !important;
    width:var(--harri-canvas-width) !important;
    min-width:var(--harri-canvas-width) !important;
    max-width:var(--harri-canvas-width) !important;
    zoom:var(--harri-canvas-scale) !important;
    margin:0 !important;
    transform:none !important;
    transform-origin:0 0 !important;
  }

  /* ---------- shared desktop navigation ---------- */
  html.harri-proportional-desktop .brand{
    font-size:27px !important;
    line-height:1 !important;
  }
  html.harri-proportional-desktop .group-head,
  html.harri-proportional-desktop .project-links a,
  html.harri-proportional-desktop .standalone-nav-link,
  html.harri-proportional-desktop .harrilanpuisto-link{
    font-size:17px !important;
    line-height:18.7px !important;
  }
  html.harri-proportional-desktop .left-footer{
    font-size:13px !important;
    line-height:1.15 !important;
  }

  /* ---------- About ---------- */
  html.harri-proportional-desktop body.page-about > .about-layout{
    height:var(--harri-canvas-height) !important;
    min-height:var(--harri-canvas-height) !important;
    max-height:var(--harri-canvas-height) !important;
    --page-pad-x:18px !important;
    --page-pad-top:32px !important;
    --page-pad-bottom:25px !important;
    --left-w:220px !important;
    --right-w:300px !important;
    --gap:28px !important;
    grid-template-columns:220px minmax(0,1fr) 300px !important;
    gap:28px !important;
    padding:32px 18px 25px !important;
  }
  html.harri-proportional-desktop body.page-about .left nav{
    margin-top:148px !important;
  }
  html.harri-proportional-desktop body.page-about .about-copy{
    font-size:40px !important;
    line-height:1.18 !important;
    letter-spacing:-.025em !important;
  }
  html.harri-proportional-desktop body.page-about .about-greeting{
    font-size:54px !important;
  }
  html.harri-proportional-desktop body.page-about .cv-column{
    padding-top:0 !important;
  }
  /* Current approved CV = Research H2 + Research running text. */
  html.harri-proportional-desktop body.page-about .cv-section h2{
    font-size:18px !important;
    line-height:1.15 !important;
    font-weight:700 !important;
    letter-spacing:0 !important;
    margin:0 0 12px !important;
  }
  html.harri-proportional-desktop body.page-about .cv-item{
    font-size:18px !important;
    line-height:1.2 !important;
  }

  /* ---------- Work / Artistic / Harrilanpuisto ---------- */
  html.harri-proportional-desktop body.page-work > .layout,
  html.harri-proportional-desktop body.page-harrilanpuisto > .layout{
    min-height:var(--harri-canvas-height) !important;
    grid-template-columns:220px minmax(0,745fr) minmax(0,660fr) !important;
    gap:28px !important;
    padding:32px 18px 26px !important;
  }
  html.harri-proportional-desktop body.page-work .project-type,
  html.harri-proportional-desktop body.page-harrilanpuisto .project-type{
    font-size:27px !important;
    line-height:1 !important;
  }
  html.harri-proportional-desktop body.page-work .project-info h1,
  html.harri-proportional-desktop body.page-harrilanpuisto .project-info h1{
    font-size:54px !important;
    line-height:.94 !important;
    max-width:610px !important;
  }
  html.harri-proportional-desktop body.page-work .project-info h1 .title-line,
  html.harri-proportional-desktop body.page-harrilanpuisto .project-info h1 .title-line{
    white-space:nowrap !important;
  }
  html.harri-proportional-desktop body.page-work .project-description,
  html.harri-proportional-desktop body.page-harrilanpuisto .project-description{
    font-size:18px !important;
    line-height:1.2 !important;
  }
  /* Work's 18px source gutter is intentionally not overridden. It scales with
     the composition, keeping exactly the same relative spacing. */

  /* ---------- Research ---------- */
  html.harri-proportional-desktop body.page-research > .layout{
    height:var(--harri-canvas-height) !important;
    min-height:var(--harri-canvas-height) !important;
    max-height:var(--harri-canvas-height) !important;
    grid-template-columns:220px minmax(0,745fr) minmax(0,660fr) !important;
    grid-template-rows:minmax(0,1fr) !important;
    gap:28px !important;
    padding:32px 18px 26px !important;
    overflow:hidden !important;
  }
  html.harri-proportional-desktop body.page-research .project-title{
    font-size:27px !important;
    line-height:1 !important;
  }
  html.harri-proportional-desktop body.page-research .paper h1{
    font-size:54px !important;
    line-height:.95 !important;
  }
  html.harri-proportional-desktop body.page-research .paper h1 .title-line{
    white-space:nowrap !important;
  }
  html.harri-proportional-desktop body.page-research .paper p,
  html.harri-proportional-desktop body.page-research .research-copy ul > li,
  html.harri-proportional-desktop body.page-research .paper section:not(#abstract) > h2,
  html.harri-proportional-desktop body.page-research .paper .research-copy h2,
  html.harri-proportional-desktop body.page-research .paper section:not(#abstract) > h3,
  html.harri-proportional-desktop body.page-research .paper .research-copy h3{
    font-size:18px !important;
  }
  html.harri-proportional-desktop body.page-research .paper p,
  html.harri-proportional-desktop body.page-research .research-copy ul > li{
    line-height:1.2 !important;
  }
  html.harri-proportional-desktop body.page-research .toc{
    --research-toc-fit:1 !important;
    width:min(320px,48%) !important;
    min-width:290px !important;
    margin-right:20% !important;
    margin-top:0 !important;
    gap:34px !important;
    font-size:13px !important;
    line-height:1.04 !important;
  }
  /* Same hanging line visually: 43.5% of the scaled desktop viewport. */
  html.harri-proportional-desktop body.page-research .figure-stage{
    top:var(--harri-research-hanging-top) !important;
    right:3.5% !important;
    width:94% !important;
    max-width:700px !important;
    margin:0 !important;
  }
}
</style>

<script id="harri-proportional-desktop-canvas-script-v7">
(function(){
  const REFERENCE_WIDTH = 1536;
  const DESKTOP_BREAKPOINT = 900;
  const html = document.documentElement;

  let baselineDpr = window.devicePixelRatio || 1;
  let baselineScreenWidth = window.screen ? window.screen.width : 0;
  let baselineScreenHeight = window.screen ? window.screen.height : 0;
  let raf = 0;

  function pageRoot(){
    return document.querySelector('body > .about-layout, body > .layout');
  }

  function clearCanvas(){
    html.classList.remove('harri-proportional-desktop');
    html.style.removeProperty('--harri-canvas-scale');
    html.style.removeProperty('--harri-canvas-height');
    html.style.removeProperty('--harri-research-hanging-top');
    delete window.__harriCanvasScale;
  }

  function applyCanvas(){
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(function(){
      const root = pageRoot();
      if(!root) return;

      if(window.innerWidth <= DESKTOP_BREAKPOINT){
        clearCanvas();
        return;
      }

      const scale = window.innerWidth / REFERENCE_WIDTH;
      const sourceHeight = window.innerHeight / scale;
      const hangingTop = sourceHeight * 0.435;

      html.classList.add('harri-proportional-desktop');
      html.style.setProperty('--harri-canvas-scale', scale.toFixed(8));
      html.style.setProperty('--harri-canvas-height', sourceHeight.toFixed(4) + 'px');
      html.style.setProperty('--harri-research-hanging-top', hangingTop.toFixed(4) + 'px');
      html.dataset.harriCanvasScale = scale.toFixed(8);
      window.__harriCanvasScale = scale;

      window.dispatchEvent(new CustomEvent('harri:canvas-scaled', {
        detail:{scale:scale, sourceHeight:sourceHeight}
      }));
    });
  }

  function physicalScreenChanged(){
    if(!window.screen) return false;
    return window.screen.width !== baselineScreenWidth ||
           window.screen.height !== baselineScreenHeight;
  }

  function onResize(){
    const currentDpr = window.devicePixelRatio || 1;
    const dprChanged = Math.abs(currentDpr - baselineDpr) > 0.01;
    const screenChanged = physicalScreenChanged();

    /* Preserve normal browser page zoom on the same physical monitor. */
    if(dprChanged && !screenChanged) return;

    if(screenChanged){
      baselineDpr = currentDpr;
      baselineScreenWidth = window.screen.width;
      baselineScreenHeight = window.screen.height;
    }

    applyCanvas();
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', applyCanvas, {once:true});
  }else{
    applyCanvas();
  }

  window.addEventListener('resize', onResize, {passive:true});
  window.addEventListener('orientationchange', applyCanvas, {passive:true});
})();
</script>
