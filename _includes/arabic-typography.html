<style id="harri-arabic-typography-v2">
/*
  HARRI.LA — SCRIPT-AWARE ARABIC TYPOGRAPHY

  Geist remains the Latin typeface.
  Every rendered Arabic run is explicitly assigned IBM Plex Sans Arabic.
*/
.harri-arabic-run,
[lang="ar"],
[lang^="ar-"]{
  font-family:"IBM Plex Sans Arabic", sans-serif !important;
  font-synthesis:none;
}

.harri-arabic-run{
  unicode-bidi:isolate;
}

/* Fully/predominantly Arabic blocks receive RTL paragraph direction.
   Mixed-language paragraphs are NOT reversed. */
.harri-arabic-block{
  font-family:"IBM Plex Sans Arabic", sans-serif !important;
  direction:rtl;
  unicode-bidi:isolate;
}
</style>

<script id="harri-arabic-typography-v2-script">
(function(){
  "use strict";

  /* Load IBM Plex Sans Arabic independently of the individual layout files. */
  function ensureArabicFont(){
    if(document.querySelector('link[data-harri-ibm-plex-arabic]')) return;

    const existing = Array.from(
      document.querySelectorAll('link[rel="stylesheet"]')
    ).some(function(link){
      return (link.href || "").includes("IBM+Plex+Sans+Arabic");
    });

    if(existing) return;

    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href =
      "https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap";
    link.setAttribute("data-harri-ibm-plex-arabic", "true");
    document.head.appendChild(link);
  }

  ensureArabicFont();

  /*
    Arabic-script characters:
    Arabic, Arabic Supplement, Arabic Extended-A,
    Arabic Presentation Forms A/B.
  */
  const ARABIC_CHAR =
    /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]/;

  /*
    Deliberately simple and robust:
    wrap each contiguous Arabic-script run. Spaces stay outside the spans,
    which avoids accidentally absorbing nearby Latin words while still
    guaranteeing that every Arabic glyph uses IBM Plex Sans Arabic.
  */
  const ARABIC_RUN =
    /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF\u200C\u200D\u0640]+/g;

  const SKIP_TAGS = new Set([
    "SCRIPT","STYLE","NOSCRIPT","TEXTAREA","INPUT","SELECT","OPTION",
    "CODE","PRE","SVG","PATH","CANVAS"
  ]);

  let processing = false;

  function hasArabic(text){
    return ARABIC_CHAR.test(text || "");
  }

  function isPredominantlyArabic(text){
    const chars = Array.from(text || "").filter(function(ch){
      return /[A-Za-z]/.test(ch) || ARABIC_CHAR.test(ch);
    });

    if(!chars.length) return false;

    let arabic = 0;
    chars.forEach(function(ch){
      if(ARABIC_CHAR.test(ch)) arabic++;
    });

    return arabic / chars.length > 0.6;
  }

  function wrapArabicRuns(root){
    if(!root) return;

    const walker = document.createTreeWalker(
      root,
      NodeFilter.SHOW_TEXT,
      {
        acceptNode(node){
          const text = node.nodeValue || "";
          if(!hasArabic(text)) return NodeFilter.FILTER_REJECT;

          const parent = node.parentElement;
          if(!parent || SKIP_TAGS.has(parent.tagName)){
            return NodeFilter.FILTER_REJECT;
          }

          if(parent.closest(".harri-arabic-run")){
            return NodeFilter.FILTER_REJECT;
          }

          return NodeFilter.FILTER_ACCEPT;
        }
      }
    );

    const nodes = [];
    while(walker.nextNode()) nodes.push(walker.currentNode);

    nodes.forEach(function(node){
      const text = node.nodeValue || "";
      ARABIC_RUN.lastIndex = 0;

      const fragment = document.createDocumentFragment();
      let lastIndex = 0;
      let match;
      let changed = false;

      while((match = ARABIC_RUN.exec(text))){
        changed = true;

        if(match.index > lastIndex){
          fragment.appendChild(
            document.createTextNode(text.slice(lastIndex, match.index))
          );
        }

        const span = document.createElement("span");
        span.className = "harri-arabic-run";
        span.lang = "ar";
        span.dir = "rtl";
        span.textContent = match[0];

        /* Inline declaration is intentional: it wins even if a template has
           a more specific Geist declaration with !important elsewhere. */
        span.style.setProperty(
          "font-family",
          '"IBM Plex Sans Arabic", sans-serif',
          "important"
        );

        fragment.appendChild(span);
        lastIndex = match.index + match[0].length;
      }

      if(!changed) return;

      if(lastIndex < text.length){
        fragment.appendChild(
          document.createTextNode(text.slice(lastIndex))
        );
      }

      node.parentNode.replaceChild(fragment, node);
    });
  }

  function markArabicBlocks(root){
    if(!root || !root.querySelectorAll) return;

    const selector = [
      "p","li","figcaption",
      "h1","h2","h3","h4","h5","h6",
      ".welcome",
      ".project-name",
      ".section-title",
      ".nav-section-title",
      ".about-copy",
      ".cv-item",
      ".project-description",
      ".article-body",
      ".paper",
      ".figure-caption"
    ].join(",");

    const elements = [];

    if(root.nodeType === 1 && root.matches && root.matches(selector)){
      elements.push(root);
    }

    root.querySelectorAll(selector).forEach(function(el){
      elements.push(el);
    });

    elements.forEach(function(el){
      if(el.closest("script,style,textarea,code,pre,svg")) return;

      const text = (el.textContent || "").trim();
      const shouldBeArabic = hasArabic(text) && isPredominantlyArabic(text);

      el.classList.toggle("harri-arabic-block", shouldBeArabic);

      if(shouldBeArabic){
        el.lang = "ar";
        el.dir = "rtl";
      }else{
        if(el.getAttribute("lang") === "ar") el.removeAttribute("lang");
        if(el.getAttribute("dir") === "rtl") el.removeAttribute("dir");
      }
    });
  }

  function process(root){
    if(processing || !root) return;

    processing = true;
    try{
      wrapArabicRuns(root);
      markArabicBlocks(root.nodeType === 1 ? root : document.body);
    }finally{
      processing = false;
    }
  }

  function processPage(){
    if(document.body) process(document.body);

    /* Re-run after the webfont resolves so any font-metric-dependent layout
       code sees the real IBM Plex Arabic metrics. */
    if(document.fonts && document.fonts.load){
      document.fonts
        .load('400 16px "IBM Plex Sans Arabic"')
        .then(function(){
          if(document.body) process(document.body);
          window.dispatchEvent(new Event("resize"));
        })
        .catch(function(){});
    }
  }

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", processPage, {once:true});
  }else{
    processPage();
  }

  /*
    Covers:
      • CMS-rendered content
      • changing greetings
      • dynamically created captions/navigation
      • later JavaScript text replacements
  */
  if("MutationObserver" in window){
    const observer = new MutationObserver(function(mutations){
      if(processing) return;

      const roots = new Set();

      mutations.forEach(function(mutation){
        if(mutation.type === "characterData"){
          if(mutation.target.parentElement){
            roots.add(mutation.target.parentElement);
          }
          return;
        }

        mutation.addedNodes.forEach(function(node){
          if(node.nodeType === 1){
            roots.add(node);
          }else if(node.nodeType === 3 && node.parentElement){
            roots.add(node.parentElement);
          }
        });
      });

      roots.forEach(process);
    });

    function observe(){
      if(!document.body) return;
      observer.observe(document.body, {
        childList:true,
        subtree:true,
        characterData:true
      });
    }

    if(document.body){
      observe();
    }else{
      document.addEventListener("DOMContentLoaded", observe, {once:true});
    }
  }
})();
</script>
