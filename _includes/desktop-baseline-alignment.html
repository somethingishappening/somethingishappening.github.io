<style id="harri-desktop-baseline-style">
.harri-baseline-marker{
  display:inline-block !important;
  width:0 !important;
  height:0 !important;
  margin:0 !important;
  padding:0 !important;
  border:0 !important;
  overflow:hidden !important;
  vertical-align:baseline !important;
  line-height:0 !important;
  font-size:0 !important;
  pointer-events:none !important;
}
</style>

<script class="harri-desktop-baseline-script">
(function(){
  const targetSelector = {{ include.target | jsonify }};
  const desktopBreakpoint = 900;

  function start(){
    const target = document.querySelector(targetSelector);
    const footer = document.querySelector(".left-footer");
    if(!target || !footer) return;

    let raf = 0;
    let targetMarker = null;
    let footerMarker = null;

    function visible(el){
      if(!el) return false;
      const style = getComputedStyle(el);
      return style.display !== "none" &&
             style.visibility !== "hidden" &&
             el.getClientRects().length > 0;
    }

    function lastVisibleFooterItem(){
      const items = Array.from(footer.children).filter(visible);
      return items.length ? items[items.length - 1] : null;
    }

    function lastTextNode(container){
      const walker = document.createTreeWalker(
        container,
        NodeFilter.SHOW_TEXT,
        {
          acceptNode(node){
            if(!node.nodeValue || !node.nodeValue.trim()){
              return NodeFilter.FILTER_REJECT;
            }
            const parent = node.parentElement;
            if(!parent || !visible(parent)){
              return NodeFilter.FILTER_REJECT;
            }
            return NodeFilter.FILTER_ACCEPT;
          }
        }
      );

      let last = null;
      while(walker.nextNode()) last = walker.currentNode;
      return last;
    }

    function makeMarker(container, role){
      const old = container.querySelector(
        '.harri-baseline-marker[data-baseline-role="' + role + '"]'
      );
      if(old) old.remove();

      const textNode = lastTextNode(container);
      if(!textNode) return null;

      const marker = document.createElement("span");
      marker.className = "harri-baseline-marker";
      marker.dataset.baselineRole = role;
      marker.setAttribute("aria-hidden", "true");

      textNode.parentNode.insertBefore(marker, textNode.nextSibling);
      return marker;
    }

    function ensureMarkers(){
      if(!targetMarker || !targetMarker.isConnected){
        targetMarker = makeMarker(target, "target");
      }

      const lastFooter = lastVisibleFooterItem();
      if(!lastFooter) return false;

      if(
        !footerMarker ||
        !footerMarker.isConnected ||
        !lastFooter.contains(footerMarker)
      ){
        footerMarker = makeMarker(lastFooter, "footer");
      }

      return !!(targetMarker && footerMarker);
    }

    function align(){
      cancelAnimationFrame(raf);

      raf = requestAnimationFrame(function(){
        if(window.innerWidth <= desktopBreakpoint){
          target.style.transform = "";
          return;
        }

        /*
          Always measure from the target's natural, unshifted position.
          The footer remains the fixed reference; only the main text moves.
        */
        target.style.transform = "";

        if(!ensureMarkers()) return;

        const targetBaseline = targetMarker.getBoundingClientRect().top;
        const footerBaseline = footerMarker.getBoundingClientRect().top;
        const delta = footerBaseline - targetBaseline;

        target.style.transform =
          "translateY(" + delta.toFixed(2) + "px)";
      });
    }

    /*
      Arabic typography and CMS content can alter line metrics after initial
      parsing. Start after DOMContentLoaded, then re-align after fonts settle.
    */
    align();

    window.addEventListener("resize", align, {passive:true});
    window.addEventListener("orientationchange", align, {passive:true});

    if(document.fonts && document.fonts.ready){
      document.fonts.ready.then(function(){
        targetMarker = null;
        footerMarker = null;
        align();
      });
    }

    if("ResizeObserver" in window){
      const observer = new ResizeObserver(function(){
        align();
      });
      observer.observe(target);
      observer.observe(footer);
    }
  }

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", start, {once:true});
  } else {
    start();
  }
})();
</script>
